# Render Blueprint - SimbaSMS Backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: simbasms-api
    env: node
    region: oregon
    plan: starter
    rootDir: apps/api
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && node dist/main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: simbasms-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: simbasms-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: PORT
        value: "4000"
      - key: FRONTEND_URL
        value: "https://web-beta-ashen-60.vercel.app"
      - key: APP_BASE_URL
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: VIRTUALSMS_API_KEY
        sync: false
      - key: VIRTUALSMS_BASE_URL
        value: "https://api.virtualsms.com"
      - key: FIVESIM_API_KEY
        sync: false
      - key: FIVESIM_BASE_URL
        value: "https://5sim.net/v1"
      - key: NOWPAYMENTS_API_KEY
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET
        sync: false

  - type: redis
    name: simbasms-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: simbasms-db
    plan: starter
    databaseName: simbasms
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow all connections (for development)
